name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: burrunan/gradle-cache-action@v2

      - name: Build patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew buildAndroid -Pversion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv "patches/build/libs/patches-${version}.rvp" patches.rvp
          gh release create "$GITHUB_REF_NAME" patches.rvp --verify-tag --generate-notes

  feeds:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/feeds.yml
