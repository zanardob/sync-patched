name: Validations

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: burrunan/gradle-cache-action@v2

      - name: Build patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew buildAndroid
