name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: burrunan/gradle-cache-action@v2

      - name: Build patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew buildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: sync-patched
          path: patches/build/libs/*.rvp
